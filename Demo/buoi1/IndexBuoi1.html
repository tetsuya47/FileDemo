<!DOCTYPE HTML>
<html>
    <head>
        <title> Buổi 1 - Giới Thiệu HTML</title>
    </head>
    <body>
        <!-- Tiêu đề: h1 - h6 -->
        <h1>Bài 1: Giới Thiệu HTML cơ bản </h1>
        <h2>Tiêu đề 2</h2>
        <h3>Tiêu đề 3</h3>
        <h4>Tiêu đề 4</h4>
        <h5>Tiêu đề 5</h5>
        <h6>Tiêu đề 6</h6>
        <p> Đây là một đoạn văn vô tri có 200 ký tự,
            <br>viết bằng tiếng việt
        </p>
        <!-- Chỉ số trên là <sup> -->
            x<sup>2</sup>+
        <!-- Chỉ số dưới: sub -->
            H<sub>2</sub>SO<sub>4</sub>
        <!-- in đậm: strong/b -->
         <p>Tôi đang học <b>Xây dựng trang web</b> vào <strong>ca 3</strong></p>
        <!-- in nghiêng i/em -->
         <p>Tại địa chỉ: <i> 99 Nguyễn Văn Linh</i> - <em>Cao đẳng FPT Tây Nguyên</em> </p>
    </body>
</html>
